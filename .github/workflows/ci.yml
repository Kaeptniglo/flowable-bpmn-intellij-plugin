name: Plugin CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: |
        ./gradlew clean build \
            :flowable-intellij-plugin:buildPlugin :flowable-intellij-plugin:verifyPlugin \
            :camunda-intellij-plugin:buildPlugin :camunda-intellij-plugin:verifyPlugin \
            :activiti-intellij-plugin:buildPlugin :activiti-intellij-plugin:verifyPlugin
    - name: Upload plugin distributions
      uses: actions/upload-artifact@v4
      with:
        name: plugin-distributions
        path: '*-intellij-plugin/build/distributions/*.zip'
        if-no-files-found: error
