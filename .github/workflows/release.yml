# Publishing to the JetBrains Marketplace is DISABLED in this fork.
#
# The plugin IDs in this repository (flowable-bpmn-visualizer, activiti-bpmn-visualizer,
# camunda-bpmn-visualizer) belong to the upstream project by Valentyn Berezin. Publishing
# this fork under them is not possible, and doing so would require registering separate
# plugin IDs first.
#
# The trigger is therefore workflow_dispatch only: it no longer fires automatically on
# 'v*' tags. Do not enable the tag trigger before the plugin IDs have been changed and an
# INTELLIJ_PLUGIN_PUBLISH_TOKEN for your own Marketplace account is configured.
#
# To build a distributable ZIP without publishing, use the Plugin CI workflow, which
# uploads the plugin distributions as a build artifact.

name: Plugin release (disabled in fork)

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build, test with Gradle
        run: ./gradlew clean build buildPlugin verifyPlugin jacocoTestReport
      - name: Upload plugin distributions
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distributions
          path: '*-intellij-plugin/build/distributions/*.zip'
          if-no-files-found: error
