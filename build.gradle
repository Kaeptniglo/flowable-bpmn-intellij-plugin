import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.kapt' version '2.4.10'
}

ext {
    intellijPlatformVersion = '2026.2.1'
    intellijPlatformPlugins = ['com.intellij.java', 'com.intellij.database'] // DatabaseTools is for BPMN process 'debugging'

    // IntelliJ 2026.2 (build 262) ships class files with major version 69, i.e. Java 25
    javaVersion = 25
    sinceBuildVersion = '262'
    pluginVersion = '0.6.0-2026.2' // Fork version, deliberately above upstream 0.5.4.4 to tell the builds apart

    kotlinStdlib = '2.4.10'
    kotlinApiVersion = '2.2' // It must not exceed the JB supplied Kotlin STDLIB, which is 2.4 for 2026.2. See https://youtrack.jetbrains.com/issue/KT-37435

    mapstruct = '1.4.2.Final'
    jackson = '2.15.2'
    dom4j = '2.0.0'

    junitJupiter = '5.6.2'
    jsonPath = '2.8.0'
    junitPlatformRunner = '1.6.2'
    kluent = '1.68'
    mockitoCore = '5.23.0'
    mockitoKotlin = '2.2.0'
}

group = 'com.valb3r'

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

repositories {
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaUltimate(intellijPlatformVersion)
        bundledPlugins(intellijPlatformPlugins)
    }
}

allprojects {
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = '0.8.15' // 0.8.12 can't instrument Java 25 class files
    }
}



subprojects {
    tasks.withType(Test) {
        useJUnitPlatform()
    }

    tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget = JvmTarget.fromTarget(javaVersion.toString())
            apiVersion = KotlinVersion.fromVersion(kotlinApiVersion)
        }
    }
}
